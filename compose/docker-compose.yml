services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]   # entrypoint image resmi: chown data dir lalu turun ke user postgres
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 200   # satu proses per koneksi (bukan thread) — lebih longgar dari service lain
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/qrizan/nestjs-swagger-prisma:0.0.1-rc.4@sha256:c61d246641e8a8cf7401dbce370c25c0c9047bce2dd303a8b05f90eb557f0870
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - catalog
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/qrizan/nestjs-swagger-prisma:0.0.1-rc.4@sha256:c61d246641e8a8cf7401dbce370c25c0c9047bce2dd303a8b05f90eb557f0870
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      - catalog
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    image: ghcr.io/qrizan/react-shadcn-redux:0.0.1-rc.2@sha256:b456481cb65f1e2d6b066194f8db7f01663a334e0e17faad18c1411ca76f0985
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 100
    environment:
      API_URL: /api
    networks:
      - catalog

  public:
    image: ghcr.io/qrizan/nextjs-chakra-reactquery:0.0.1-rc.4@sha256:300b04d4792603c857a05fe2cfcbe6ddecb5afa36f9cf362b663e24921d829d8
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    environment:
      API_URL: /api
      API_BACKEND_INTERNAL: http://api:3000
    networks:
      - catalog
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID"]   # master (root, directive "user nginx") chown dir temp (client_temp dkk) ke uid nginx sebelum fork worker, baru drop privilege — dikonfirmasi dari log runtime, bukan analogi dari postgres
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.3
    pids_limit: 200   # worker_processes auto di image bawaan ikut jumlah core host — tidak diketahui persis, disamakan dengan postgres (batas longgar)
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - catalog
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      public:
        condition: service_healthy
      garage:
        condition: service_healthy

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    cap_drop: ["ALL"]   # tidak butuh cap_add: image tidak punya proses privilege-drop seperti postgres, dan port 3900-3903 semua di atas 1024
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: assets
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    networks:
      - catalog
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  catalog:

volumes:
  postgres-data:
  garage-data:
