{{- if not .Values.bootstrapOnly }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: {{ .Values.namespace }}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage:3901"

    [s3_api]
    api_bind_addr = "[::]:3900"
    s3_region = "{{ .Values.garage.region }}"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = "{{ .Values.garage.rootDomain }}"

    [admin]
    api_bind_addr = "[::]:3903"
{{- end }}
