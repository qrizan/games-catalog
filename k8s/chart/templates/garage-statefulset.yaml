{{- if not .Values.bootstrapOnly }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: {{ .Values.namespace }}
  labels:
    app: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.garage.securityContext.runAsUser }}
        runAsGroup: {{ .Values.garage.securityContext.runAsGroup }}
        fsGroup: {{ .Values.garage.securityContext.runAsGroup }}
      containers:
        - name: garage
          image: "{{ .Values.garage.image.repository }}:{{ .Values.garage.image.tag }}@{{ .Values.garage.image.digest }}"
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          envFrom:
            - secretRef:
                name: {{ .Values.garage.credentialsSecretName }}
          env:
            - name: GARAGE_DEFAULT_BUCKET
              value: {{ .Values.garage.bucket }}
          volumeMounts:
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: garage-data
              mountPath: /var/lib/garage
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.garage.resources.requests.cpu }}
              memory: {{ .Values.garage.resources.requests.memory }}
            limits:
              cpu: {{ .Values.garage.resources.limits.cpu }}
              memory: {{ .Values.garage.resources.limits.memory }}
      volumes:
        - name: garage-config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: garage-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.garage.storage }}
{{- end }}
