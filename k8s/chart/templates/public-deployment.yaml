{{- if not .Values.bootstrapOnly }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public
  namespace: {{ .Values.namespace }}
  labels:
    app: public
spec:
  replicas: {{ .Values.public.replicas }}
  selector:
    matchLabels:
      app: public
  template:
    metadata:
      labels:
        app: public
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.public.imagePullSecret }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.public.securityContext.runAsUser }}
        runAsGroup: {{ .Values.public.securityContext.runAsGroup }}
      containers:
        - name: public
          image: "{{ .Values.public.image.repository }}:{{ .Values.public.image.tag }}@{{ .Values.public.image.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_URL
              value: "{{ .Values.public.apiUrl }}"
            - name: API_BACKEND_INTERNAL
              value: "{{ .Values.public.apiBackendInternal }}"
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: {{ .Values.public.resources.requests.cpu }}
              memory: {{ .Values.public.resources.requests.memory }}
            limits:
              cpu: {{ .Values.public.resources.limits.cpu }}
              memory: {{ .Values.public.resources.limits.memory }}
{{- end }}
