{{- if not .Values.bootstrapOnly }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.publicHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public
                port:
                  number: 8080
{{- end }}
