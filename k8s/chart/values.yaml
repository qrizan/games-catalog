namespace: default

bootstrapOnly: false

ingress:
  className: nginx
  adminHost: admin.localhost
  publicHost: catalog.localhost
  assetsHost: assets.localhost   # harus <garage.bucket>.<garage.rootDomain tanpa titik depan>
  grafanaHost: grafana.localhost

garage:
  image:
    repository: dxflrs/garage
    tag: v2.3.0
    digest: sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
  credentialsSecretName: garage-credentials
  bucket: assets
  region: garage   # dipakai garage.toml dan tanda tangan SigV4 di api; keduanya harus sama
  rootDomain: .localhost
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  storage: 1Gi

postgres:
  image:
    repository: postgres
    tag: 18-alpine
    digest: sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
  credentialsSecretName: postgres-credentials
  securityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  storage: 1Gi

api:
  image:
    repository: ghcr.io/qrizan/nestjs-swagger-prisma
    tag: 0.0.2
    digest: sha256:5d4e2db57864f8ab0da3523333bf16e84cafcb10daa36ebcb4c869f95a4b0640
  imagePullSecret: ghcr-pull-secret
  postgresCredentialsSecretName: postgres-credentials
  s3:
    endpoint: http://garage:3900
    # Hanya access key yang diambil dari Secret ini, bukan RPC secret dan admin token.
    credentialsSecretName: garage-credentials
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  jwtSecretName: api-secrets
  jwtExpiresIn: "3600"
  corsOrigins: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

admin:
  image:
    repository: ghcr.io/qrizan/react-shadcn-redux
    tag: 0.0.1-rc.2
    digest: sha256:b456481cb65f1e2d6b066194f8db7f01663a334e0e17faad18c1411ca76f0985
  imagePullSecret: ghcr-pull-secret
  securityContext:
    runAsUser: 101
    runAsGroup: 101
  apiUrl: /api
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

public:
  image:
    repository: ghcr.io/qrizan/nextjs-chakra-reactquery
    tag: 0.0.1-rc.4
    digest: sha256:300b04d4792603c857a05fe2cfcbe6ddecb5afa36f9cf362b663e24921d829d8
  imagePullSecret: ghcr-pull-secret
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  apiUrl: /api
  apiBackendInternal: http://api:3000
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

migrate:
  waitForPostgres:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus:
  image:
    repository: prom/prometheus
    tag: v3.13.2
    digest: sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
  securityContext:
    runAsUser: 65534   # "nobody" di image quay.io/prometheus/busybox, sama dengan default chart resmi prometheus-community
    runAsGroup: 65534
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  image:
    repository: grafana/grafana
    tag: "13.1.3"
    digest: sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
  credentialsSecretName: grafana-credentials
  securityContext:
    runAsUser: 472   # user "grafana" default image resmi, sama dengan default chart grafana-community/helm-charts
    runAsGroup: 472
    fsGroup: 472
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi   # 256Mi terbukti OOMKilled (exit 137) saat load Home dashboard pertama kali, 2026-08-09
